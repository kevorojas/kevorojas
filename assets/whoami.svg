<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <!-- window -->
  <rect x="1" y="1" width="758" height="468" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <line x1="1" y1="46" x2="759" y2="46" stroke="#21262d" stroke-width="1"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="24" r="6" fill="#27c93f"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" fill="#6e7681">kevo@devops — zsh</text>

  <!-- prompt -->
  <text x="28" y="86" font-size="15">
    <tspan fill="#02BAD5" font-weight="bold">kevo@devops</tspan><tspan fill="#8b949e">:~$ </tspan>
  </text>

  <!-- typed command (looping clip reveal) -->
  <clipPath id="typing">
    <rect x="163" y="70" width="0" height="24">
      <animate attributeName="width" dur="7.5s" repeatCount="indefinite"
               values="0;0;290;290;0;0" keyTimes="0;0.04;0.213;0.9;0.94;1"/>
    </rect>
  </clipPath>
  <text x="163" y="86" font-size="15" fill="#FEFFFB" clip-path="url(#typing)">kubectl describe engineer kevo</text>
  <!-- typing caret that follows the reveal -->
  <rect y="72" width="8" height="18" fill="#02BAD5">
    <animate attributeName="x" dur="7.5s" repeatCount="indefinite"
             values="163;163;453;453;163" keyTimes="0;0.04;0.213;0.93;1"/>
    <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.213;0.22;0.98;1"/>
  </rect>

  <!-- output lines (looping sequential reveal) -->
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.253;0.28;0.92;1"/>
    <text x="28" y="140" font-size="14.5"><tspan fill="#02BAD5">Name       </tspan><tspan fill="#c9d1d9">Kevo Rojas</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.277;0.304;0.92;1"/>
    <text x="28" y="168" font-size="14.5"><tspan fill="#02BAD5">Role       </tspan><tspan fill="#c9d1d9">DevOps / Cloud Engineer</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.301;0.328;0.92;1"/>
    <text x="28" y="196" font-size="14.5"><tspan fill="#02BAD5">Focus      </tspan><tspan fill="#c9d1d9">Kubernetes · GitOps · Infra as Code</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.325;0.352;0.92;1"/>
    <text x="28" y="224" font-size="14.5"><tspan fill="#02BAD5">Clouds     </tspan><tspan fill="#c9d1d9">Azure, AWS</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.349;0.376;0.92;1"/>
    <text x="28" y="252" font-size="14.5"><tspan fill="#02BAD5">Toolbelt   </tspan><tspan fill="#c9d1d9">Terraform, ArgoCD, Helm, Docker, Linux</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.373;0.4;0.92;1"/>
    <text x="28" y="280" font-size="14.5"><tspan fill="#02BAD5">Currently  </tspan><tspan fill="#c9d1d9">automatizando todo lo automatizable</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.397;0.424;0.92;1"/>
    <text x="28" y="308" font-size="14.5"><tspan fill="#02BAD5">Learning   </tspan><tspan fill="#c9d1d9">platform engineering</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.421;0.448;0.92;1"/>
    <text x="28" y="336" font-size="14.5"><tspan fill="#02BAD5">Fun fact   </tspan><tspan fill="#c9d1d9">construí un HUD de Iron Man con IA local</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.445;0.472;0.92;1"/>
    <text x="28" y="364" font-size="14.5"><tspan fill="#02BAD5">Status     </tspan></text>
    <circle cx="150" cy="359" r="5" fill="#27c93f"/>
    <text x="164" y="364" font-size="14.5" fill="#c9d1d9">Deploying since 2020</text></g>

  <!-- final prompt with blinking caret -->
  <g opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.49;0.52;0.92;1"/>
    <text x="28" y="418" font-size="15"><tspan fill="#02BAD5" font-weight="bold">kevo@devops</tspan><tspan fill="#8b949e">:~$ </tspan></text>
    <rect x="163" y="404" width="9" height="18" fill="#02BAD5">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
